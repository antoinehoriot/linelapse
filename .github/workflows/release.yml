# Build release binaries when a version tag is pushed (or by hand).
# Standard runners are free for public repositories. If the repository ever goes private
# again, drop the tag trigger: macOS minutes are billed there.
# macOS uses the floating `macos-latest` label: the pinned `macos-14` image was retired
# (v0.2.0's tag run failed with "The configuration 'macos-14-arm64-us-default' is not
# supported" and its macOS archives were built locally). The x86_64 target is
# cross-compiled on that arm64 runner. Linux arm64 builds natively on `ubuntu-22.04-arm`
# (free for public repositories), same glibc floor (2.35) as x86_64.
# Build jobs only upload artifacts; one release job then writes SHA256SUMS over all
# archives and publishes everything at once, so a release never lacks a platform or
# its checksums. A manual run (workflow_dispatch) stops at the artifacts.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux system libraries for GPUI
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan-dev
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=linelapse-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/linelapse README.md LICENSE "$name"/
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            linelapse-*.tar.gz
            linelapse-*.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          test "$(ls linelapse-*.tar.gz | wc -l)" -eq 4
          sha256sum linelapse-*.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/linelapse-*.tar.gz
            dist/linelapse-*.tar.gz.sha256
            dist/SHA256SUMS
