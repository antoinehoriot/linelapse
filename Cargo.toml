[package]
name = "linelapse"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Replay a git repository's history, line by line"

[[bin]]
name = "linelapse"
path = "src/main.rs"

[dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
memmap2 = "0.9.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
