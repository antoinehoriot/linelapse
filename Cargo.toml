[package]
name = "linelapse"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Replay a git repository's history, line by line"
repository = "https://github.com/antoinehoriot/linelapse"
homepage = "https://github.com/antoinehoriot/linelapse"
readme = "README.md"
keywords = ["git", "history", "visualization", "treemap", "gpui"]
categories = ["command-line-utilities", "visualization", "development-tools"]
exclude = ["docs/*.gif"]

[[bin]]
name = "linelapse"
path = "src/main.rs"

[dependencies]
# Pinned: libc 0.2.190 removed ENOATTR on Linux, which breaks xattr 0.2.3 (pulled in by
# gpui -> gpui_http_client -> zed-async-tar). `cargo install` ignores Cargo.lock, so the
# pin has to live here. Remove once gpui's tar dependency moves to xattr >= 1.
libc = "=0.2.189"
ab_glyph = "0.2.32"
epaint_default_fonts = "0.37.0"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
memmap2 = "0.9.12"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny-skia = "0.12.0"
